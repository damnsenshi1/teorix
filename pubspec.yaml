name: teorix
description: Multi-country driving theory learning and practice app by Senshi Labs.
publish_to: 'none'
version: 1.3.3+24

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_mobile_ads: 7.0.0
  purchases_flutter: ^10.9.0
  google_mlkit_translation: ^0.13.1
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.16.0
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  http: ^1.5.0
  package_info_plus: ^8.3.1
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/questions_tr.json
    - assets/data/lessons_tr.json
    - assets/data/traffic_signs_tr.json
    - assets/data/questions_nl.json
    - assets/data/lessons_nl.json
    - assets/data/traffic_signs_nl.json
    - assets/data/questions_de.json
    - assets/data/lessons_de.json
    - assets/data/traffic_signs_de.json
    - assets/data/questions_en_us_ca.json
    - assets/data/lessons_en_us_ca.json
    - assets/data/traffic_signs_en_us_ca.json
    - assets/data/questions_en_gb.json
    - assets/data/lessons_en_gb.json
    - assets/data/traffic_signs_en_gb.json
